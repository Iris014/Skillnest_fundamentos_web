<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Me gusta</title>
    <link rel="stylesheet" href="static/css/style.css">
</head>

<body>
    <header class="barra-nav">
        <div class="social-like">Social Like</div>
    </header>
    <main class="contenedor-principal">
        <div class="contenedor-perfil">
            <div class="tarjeta-perfil">
                <img src="static/images/foto-perfil.png" alt="foto de perfil" class="foto">
                <p class="usuario">Misato</p>
                <button class="ver-perfil">Ver perfil</button>
            </div>
        </div>
        <div class="contenedor-comunidad">
            <p class="ultimo">Últimas publicaciones</p>
            <div class="tarjetas-comunidad">
                <div class="tarjeta">
                    <div class="superior-tarjeta">
                        <p class="usuario-publicacion">Rei</p>
                        <div class="seccion-like">
                            <p class="info-likes">0 like(s)</p>
                            <button class="like">Like</button>
                        </div>
                    </div>
                        <div class="inferior-tarjeta">
                            <p class="info publicacion">
                                Acabo de configurar este nuevo <a href="#" class="enlace">bot de Discord</a>, cuéntame qué opinan ustedes.
                            </p>
                        </div>
                </div>
                <div class="tarjeta">
                    <div class="superior-tarjeta">
                        <p class="usuario-publicacion">Asuka</p>
                        <div class="seccion-like">
                            <p class="info-likes">0 like(s)</p>
                            <button class="like">Like</button>
                        </div>
                    </div>
                        <div class="inferior-tarjeta">
                            <p class="info publicacion">
                                Acabo de leer este <a href="#" class="enlace">nuevo comic</a>. Denle un vistazo.
                            </p>
                        </div>
                </div>
                <div class="tarjeta">
                    <div class="superior-tarjeta">
                        <p class="usuario-publicacion">Shinji</p>
                        <div class="seccion-like">
                            <p class="info-likes">0 like(s)</p>
                            <button class="like">Like</button>
                        </div>
                    </div>
                        <div class="inferior-tarjeta">
                            <p class="info-publicacion">
                                No puedo dejar de escuchar este <a href="#" class="enlace">álbum</a>. ¿A quién más le gusta?
                            </p>
                        </div>
                </div>
            </div>
        </div>
    </main>
    <script src="static/js/script.js"></script>
</body>

</html>
