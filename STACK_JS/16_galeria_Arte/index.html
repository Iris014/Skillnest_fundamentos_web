<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Iris Ccallomamani">
    <title>Galería de arte</title>
    <link rel="stylesheet" href="static/css/style.css">
</head>

<body>
    <header class="header">
        <h1 class="titulo">The Art Gallery</h1>
        <div class="barra-busqueda">
            <input type="text" id="busqueda" name="buscar_arte" placeholder="Buscar arte...">
        </div>
        <div class="nav">
            <button class="iniciar_sesion">Iniciar sesión</button>
        </div>
    </header>
    <main class="contenedor-principal">
        <div class="tarjeta-presentacion" id="tarjeta-arte">
            <div class="galeria">
                <img src="static/images/campo-de-trigo-con-cipreses.png" alt="campo-de-trigo-con-cipreses"
                    class="img" id="imagen-arte">
            </div>
                <p class="info" id="texto-arte">Campo de trigo con cipreses, Vincent van Gogh (1889)</p>
        </div>
    </main>
    <script src="static/js/script.js"></script>
</body>

</html>
