<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Funciones JS</title>
    <meta name="author" contebt="Iris Ccallomamani">
    <link rel="stylesheet" href="static/css/style.css">
</head>

<body>
    <div class="contenedor">
        <h1>Funciones JS</h1>
        <div class="card">
            <h2>Ejemplo 1</h2>
            <p>Funciones sin parámetros: Saludar</p>
            <button onclick="saludar()">Ejecutar</button>
        </div>
        <div class="card">
            <h2>Ejemplo 2</h2>
            <p>Funciones con parámetros: Saludar</p>
            <button onclick="saludarParam(`Iris`)">Ejecutar</button>
        </div>
        <div class="card">
            <h2>Ejemplo 3</h2>
            <p>Funciones con return: Encontrar mayor</p>
            <button onclick="encontrarMayor()">Ejecutar</button>
        </div>
    </div>
    <script src="static/js/script.js"></script>
</body>

</html>
